<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>01 采集助手</title><link rel="stylesheet" href="popup.css"><body><h1>01</h1><p>中文原作采集助手 · 测试版</p><p>扩展 ID：<code id="identifier"></code></p><label>从本地 01 复制的配对码<input id="token" type="password" autocomplete="off"></label><button id="pair">配对本地 01</button><p id="status" role="status"></p><button id="run">开始一轮采集</button><button id="open">打开需要处理的页面</button><button id="resume">验证完成，继续采集</button><button id="skip">跳过当前页面，继续其他任务</button><label><input type="checkbox" id="daily">每日北京时间 00:00 开始；浏览器重开后补采</label><button id="stop">停止并关闭每日任务</button><p>浏览器和 01 需要运行。每分钟处理一个页面，每平台每轮最多读取 10 条详情。遇到登录或验证暂停。没有原始时间不进入近期日报，没有字幕不生成观点卡。</p><script src="popup.js"></script></body></html>
