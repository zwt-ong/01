name: Verify
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: python -m unittest discover -s tests -v
      - run: node --check web/app.js
      - run: node --check web/ideas-ui.js
      - run: node --check web/platforms-ui.js
      - run: node tests/frontend-smoke.cjs
      - run: node --check browser-helper/background.js
      - run: node --check browser-helper/page-reader.js
      - run: node --check browser-helper/popup.js
      - run: node tests/browser-helper.cjs
permissions:
  contents: read
